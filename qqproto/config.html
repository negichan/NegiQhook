<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qqproto 网络配置</title>
<style>
  :root {
    --bg: #111720; --rail: #17202b; --panel: #1c2531; --panel2: #222c3a;
    --line: #2b3746; --fg: #dbe3ec; --dim: #8695a8; --accent: #2f6bd6;
    --ok: #55c27a; --bad: #e56a6a; --warn: #d9a833; --mono: ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  button, input, select { font: inherit; color: var(--fg); }
  a { color: #8cc2ff; text-decoration: none; }
  a:hover { text-decoration: underline; }

  .top {
    position: sticky; top: 0; z-index: 20; background: rgba(17, 23, 32, .94);
    border-bottom: 1px solid var(--line); backdrop-filter: blur(6px);
  }
  .top .bar { max-width: 1080px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  .top .title { font-size: 16px; font-weight: 600; }
  .top .sub { color: var(--dim); font-size: 12px; }
  .top .grow { flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font-size: 12px; color: var(--dim);
  }
  .lamp { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); display: inline-block; }
  .lamp.on { background: var(--ok); }
  .lamp.warn { background: var(--warn); }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 18px 20px 130px; }
  .note {
    background: #1a2432; border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 10px 13px; color: #b9c8da; font-size: 12.5px; margin-bottom: 16px;
  }
  .note b { color: var(--fg); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .card > .head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .card > .head .grow { flex: 1; }
  .card > .head .hint { color: var(--dim); font-size: 12px; }
  .card > .body { padding: 13px 14px; }
  .card h3 { margin: 0; font-size: 14.5px; }

  .switch { display: inline-flex; align-items: center; gap: 7px; color: var(--dim); font-size: 12.5px; cursor: pointer; user-select: none; }
  .switch input { display: none; }
  .switch .track {
    width: 34px; height: 19px; border-radius: 10px; background: #2a3543; border: 1px solid var(--line);
    position: relative; transition: background .15s; flex: 0 0 auto;
  }
  .switch .track::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%;
    background: #93a3b6; transition: transform .15s, background .15s;
  }
  .switch input:checked + .track { background: #24487e; border-color: #356399; }
  .switch input:checked + .track::after { transform: translateX(15px); background: #8fc0ff; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 11px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); min-width: 0; }
  .field input, .field select {
    background: #131a24; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; outline: none;
    width: 100%; min-width: 0;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field .tip { font-size: 11px; color: #6d7d90; }
  .mono { font-family: var(--mono); font-size: 12px; }

  .statusline { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12.5px; margin-top: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
  .dot.ok { background: var(--ok); } .dot.failed { background: var(--bad); } .dot.down { background: var(--warn); }
  .dot.disabled { background: #55657a; }

  .nets { display: flex; flex-direction: column; gap: 10px; }
  .net {
    border: 1px solid var(--line); border-radius: 9px; background: var(--panel2); padding: 11px 13px;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .net.off { opacity: .62; }
  .net .main { flex: 1; min-width: 0; }
  .net .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .net .name { font-weight: 600; font-size: 13.5px; }
  .net .addr { color: var(--dim); font: 12px var(--mono); margin-top: 3px; word-break: break-all; }
  .net .st { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; margin-top: 4px; flex-wrap: wrap; }
  .net .ops { display: flex; gap: 6px; flex: 0 0 auto; }
  .type-badge {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
    background: #223042; color: #9fb6d1; border: 1px solid #2e4054;
  }
  .type-badge.satori { background: #2a2a42; color: #bdb8ff; border-color: #40406b; }

  button.btn {
    background: #202b38; border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px;
    font-size: 12.5px; cursor: pointer;
  }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: #2f6bd6; border-color: #3f7de3; font-weight: 600; }
  button.btn.primary:hover { background: #3a75df; }
  button.btn.danger:hover { border-color: var(--bad); color: #ffb3b3; }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }
  button.icon { background: transparent; border: 0; color: var(--dim); cursor: pointer; font-size: 12px; padding: 3px 6px; border-radius: 5px; }
  button.icon:hover { color: var(--fg); background: #263242; }

  .empty {
    border: 1px dashed #33445a; border-radius: 9px; padding: 22px; text-align: center; color: var(--dim); font-size: 13px;
  }
  .empty b { color: var(--fg); }

  .addwrap { position: relative; display: inline-block; }
  .addmenu {
    position: absolute; right: 0; top: 36px; z-index: 30; width: 330px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 14px 34px rgba(0,0,0,.45); padding: 6px;
  }
  .addmenu button {
    display: block; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 7px;
    padding: 8px 10px; cursor: pointer; color: var(--fg);
  }
  .addmenu button:hover { background: #223042; }
  .addmenu .lbl { font-size: 13px; }
  .addmenu .desc { color: var(--dim); font-size: 11.5px; margin-top: 1px; }

  .savebar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    background: rgba(23, 32, 43, .96); border-top: 1px solid var(--line); backdrop-filter: blur(6px);
  }
  .savebar .inner {
    max-width: 1080px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .savebar .file { color: var(--dim); font: 11.5px var(--mono); flex: 1; min-width: 200px; word-break: break-all; }
  .savebar .dirty { color: var(--warn); font-size: 12.5px; display: none; }
  .savebar .dirty.show { display: inline; }

  .mask {
    position: fixed; inset: 0; background: rgba(5, 9, 14, .66); z-index: 40;
    display: flex; align-items: flex-start; justify-content: center; padding: 60px 16px 40px; overflow: auto;
  }
  .modal {
    width: 100%; max-width: 620px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }
  .modal .mhead { padding: 13px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .modal .mhead .grow { flex: 1; }
  .modal .mbody { padding: 14px 16px; }
  .modal .mfoot { padding: 11px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
  .modal .err { color: var(--bad); font-size: 12.5px; margin: 8px 0 0; display: none; }
  .modal .err.show { display: block; }

  .toast {
    position: fixed; right: 18px; bottom: 74px; z-index: 60; max-width: min(560px, calc(100vw - 36px));
    background: #223042; border: 1px solid var(--line); border-left: 3px solid var(--ok);
    border-radius: 8px; padding: 9px 13px; font-size: 12.5px; box-shadow: 0 12px 30px rgba(0,0,0,.4);
    display: none;
  }
  .toast.show { display: block; }
  .toast.bad { border-left-color: var(--bad); }
  .toast.warn { border-left-color: var(--warn); }
  .toast.ok { border-left-color: var(--ok); }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div>
      <div class="title">qqproto 网络配置</div>
      <div class="sub">WebSocket 正反向 · HTTP 服务器 / 上报 · Satori — 保存后热应用，不用重启</div>
    </div>
    <div class="grow"></div>
    <span class="chip" id="account"><span class="lamp" id="bridgeLamp"></span><span id="accountText">桥连接中…</span></span>
    <a class="chip" href="/">调试台</a>
    <a class="chip" href="/chat">聊天</a>
  </div>
</header>

<div class="wrap">
  <div class="note">
    <b>默认不启动任何协议端口。</b>在下面打开 Satori，或新增 OneBot 网络（正反向 WS / HTTP），
    点「保存并应用」后端口立即开始监听，并写进配置文件，重启实例后依然生效。
    端口只允许绑回环地址；保存需要右下角打开「允许修改」。
  </div>
  <div id="app"><div class="empty">正在读取配置…</div></div>
</div>

<div class="savebar">
  <div class="inner">
    <span class="file" id="filePath"></span>
    <span class="dirty" id="dirty">● 有未保存的修改</span>
    <label class="switch" title="保存会改变监听端口/连接，和发消息一样属于写操作">
      <input type="checkbox" id="allowWrite">
      <span class="track"></span>
      允许修改
    </label>
    <button class="btn" id="reloadBtn">重新载入</button>
    <button class="btn primary" id="saveBtn" disabled>保存并应用</button>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

// ------------------------------------------------------------------ helpers
const TYPE_META = {
  httpServer: {
    label: 'HTTP 服务器', badge: 'HTTP 服务器', listen: true,
    brief: '框架调用这个端口发动作；可选同端口 WebSocket 收事件',
    bot: (n) => `POST http://${n.host}:${n.port}/<action>`
  },
  wsServer: {
    label: 'WebSocket 服务器（正向）', badge: 'WS 正向', listen: true,
    brief: '框架连进来：事件推给它，动作从同一条连接回来',
    bot: (n) => `ws://${n.host}:${n.port}`
  },
  httpClient: {
    label: 'HTTP 客户端（上报）', badge: 'HTTP 上报', listen: false,
    brief: '每条事件 POST 到框架的 webhook；动作仍走 HTTP 服务器',
    bot: (n) => `事件上报 → ${n.url}`
  },
  wsClient: {
    label: 'WebSocket 客户端（反向）', badge: 'WS 反向', listen: false,
    brief: '主动连框架的 WS 服务端（NoneBot / Koishi / AstrBot 常用）',
    bot: (n) => `主动连接 → ${n.url}`
  }
};

function esc(value) {
  return String(value === undefined || value === null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function clone(value) { return JSON.parse(JSON.stringify(value)); }
function $(sel) { return document.querySelector(sel); }

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (method === 'POST') headers['X-Debug-Call'] = '1';
  try {
    const response = await fetch(path, {
      method, headers, body: body === undefined ? undefined : JSON.stringify(body)
    });
    const text = await response.text();
    let json = null;
    try { json = text ? JSON.parse(text) : null; } catch (e) { /* not json */ }
    return { ok: response.ok, status: response.status, json: json || {}, error: json && json.error };
  } catch (error) {
    return { ok: false, status: 0, json: {}, error: error.message };
  }
}

// ------------------------------------------------------------------ state
let view = null;          // latest server view {file, revision, config, status, reservedPorts}
let draft = null;         // the config being edited
let revision = 0;
let dirty = false;
let allowed = false;
let editing = null;       // { mode: 'new'|'edit', index, type, value }
let busy = false;
let toastTimer = null;
let bridge = { connected: false, self: null };

function setDirty(next) {
  dirty = next;
  $('#dirty').classList.toggle('show', dirty);
  refreshSaveBtn();
}
function refreshSaveBtn() {
  $('#saveBtn').disabled = busy || !draft || !allowed || !dirty;
}

function showToast(text, kind) {
  const box = $('#toast');
  box.textContent = text;
  box.className = 'toast show ' + (kind || 'ok');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove('show'), kind === 'bad' ? 9000 : 6000);
}

// ------------------------------------------------------------------ render
function render() {
  const app = $('#app');
  if (!draft) {
    app.innerHTML = '<div class="empty">还没有读到配置：' +
      (view && view.error ? esc(view.error) : '检查端点是否在线') + '</div>';
    return;
  }
  const satoriStatus = view && view.status ? view.status.satori : null;
  const obStatus = (view && view.status && view.status.onebot) || [];
  const byName = new Map(obStatus.map((item) => [item.name, item]));
  app.innerHTML = [
    renderSatoriCard(satoriStatus),
    renderOnebotCard(obStatus),
    renderNetworksCard(byName)
  ].join('');
  $('#filePath').textContent = view && view.file ? view.file : '';
  refreshSaveBtn();
}

function renderSatoriCard(status) {
  const s = draft.satori;
  const st = status
    ? `<span class="dot ok"></span>已监听 <span class="mono">${esc(status.bound
        ? status.bound.host + ':' + status.bound.port : '')}</span> · ${status.clients} 个客户端`
    : `<span class="dot ${s.enable ? 'down' : 'disabled'}"></span>${s.enable ? '保存后开始监听' : '未启用'}`;
  return `
  <section class="card">
    <div class="head">
      <h3>Satori</h3><span class="type-badge satori">Satori 协议</span>
      <span class="grow"></span>
      <label class="switch"><input type="checkbox" data-bind="satori.enable" ${s.enable ? 'checked' : ''}>
        <span class="track"></span>启用</label>
    </div>
    <div class="body">
      <div class="grid">
        <label class="field">监听地址
          <input data-bind="satori.host" value="${esc(s.host)}" placeholder="127.0.0.1">
          <span class="tip">只允许回环地址</span>
        </label>
        <label class="field">端口
          <input data-bind="satori.port" type="number" min="1" max="65535" value="${esc(s.port)}">
          <span class="tip">HTTP /v1/* 与 WebSocket /v1/events 同端口</span>
        </label>
        <label class="field">Token
          <input data-bind="satori.token" value="${esc(s.token)}" placeholder="留空 = 用端点 token">
          <span class="tip">NoneBot Satori 适配器的 access_token</span>
        </label>
      </div>
      <div class="statusline">${st}</div>
      ${s.enable ? `<div class="statusline">框架侧：<span class="mono">ws://${esc(s.host)}:${esc(s.port)}/v1/events</span>
        <button class="icon" data-copy="ws://${esc(s.host)}:${esc(s.port)}/v1/events">复制</button></div>` : ''}
    </div>
  </section>`;
}

function renderOnebotCard(obStatus) {
  const o = draft.onebot;
  const live = obStatus.filter((item) => item.status !== 'disabled').length;
  return `
  <section class="card">
    <div class="head">
      <h3>OneBot v11</h3><span class="type-badge">协议总开关</span>
      <span class="grow"></span>
      <label class="switch"><input type="checkbox" data-bind="onebot.enable" ${o.enable ? 'checked' : ''}>
        <span class="track"></span>启用</label>
    </div>
    <div class="body">
      <div class="grid">
        <label class="field">默认 Token
          <input data-bind="onebot.token" value="${esc(o.token)}" placeholder="留空 = 用端点 token">
          <span class="tip">网络自己填了 token 就以网络的为准</span>
        </label>
        <label class="field">默认消息格式
          <select data-bind="onebot.messagePostFormat">
            <option value="array" ${o.messagePostFormat === 'array' ? 'selected' : ''}>array（消息段数组）</option>
            <option value="string" ${o.messagePostFormat === 'string' ? 'selected' : ''}>string（CQ 码）</option>
          </select>
          <span class="tip">单个网络可以覆盖</span>
        </label>
        <label class="field">心跳间隔（毫秒）
          <input data-bind="onebot.heartbeatInterval" type="number" min="0" max="3600000" step="1000" value="${esc(o.heartbeatInterval)}">
          <span class="tip">0 = 默认 30s</span>
        </label>
        <label class="field">上报自身消息
          <label class="switch" style="padding-top:6px">
            <input type="checkbox" data-bind="onebot.reportSelfMessage" ${o.reportSelfMessage ? 'checked' : ''}>
            <span class="track"></span>把本账号发出的消息也推给框架
          </label>
        </label>
      </div>
      <div class="statusline"><span class="dot ${live ? 'ok' : (o.enable ? 'down' : 'disabled')}"></span>
        ${live ? live + ' 个网络在线' : (o.enable ? (o.networks.length ? '保存后连接' : '还没有网络，往下新增一个') : '未启用')}
      </div>
    </div>
  </section>`;
}

function renderNetworksCard(byName) {
  const nets = draft.onebot.networks;
  const cards = nets.length ? `<div class="nets">${nets.map((n, i) => renderNet(n, i, byName.get(n.name))).join('')}</div>`
    : `<div class="empty">还没有 OneBot 网络。点右上角 <b>新增网络</b> 选一种接入方式；<br>
       第一次用推荐 <b>WebSocket 客户端（反向）</b>：把地址填成你框架监听的 WebSocket URL 即可。</div>`;
  return `
  <section class="card">
    <div class="head">
      <h3>OneBot 网络</h3>
      <span class="grow"></span>
      <div class="addwrap">
        <button class="btn" id="addBtn">＋ 新增网络</button>
        <div id="addMenu" style="display:none"></div>
      </div>
    </div>
    <div class="body">${cards}</div>
  </section>`;
}

function renderNet(net, index, live) {
  const meta = TYPE_META[net.type] || { label: net.type, badge: net.type, listen: false, bot: () => '' };
  const status = live ? live.status : (net.enable ? 'down' : 'disabled');
  const dot = status === 'ok' ? 'ok' : status === 'failed' ? 'failed' : status === 'down' ? 'down' : 'disabled';
  const detail = live && live.detail ? live.detail : (net.enable ? '尚未应用（保存后生效）' : '已禁用');
  return `
  <div class="net ${net.enable ? '' : 'off'}">
    <div class="main">
      <div class="row1">
        <span class="name">${esc(net.name || '(未命名)')}</span>
        <span class="type-badge">${esc(meta.badge)}</span>
        <label class="switch" title="启用 / 禁用这个网络">
          <input type="checkbox" data-toggle-net="${index}" ${net.enable ? 'checked' : ''}>
          <span class="track"></span>
        </label>
      </div>
      <div class="addr">${esc(meta.bot(net))}${net.token ? '　token ' + esc(maskToken(net.token)) : ''}</div>
      <div class="st"><span class="dot ${dot}"></span>${esc(detail)}
        ${net.messagePostFormat ? '　· 消息格式 ' + esc(net.messagePostFormat) : ''}
        ${net.reportSelfMessage ? '　· 上报自身消息' : ''}
      </div>
    </div>
    <div class="ops">
      <button class="icon" data-edit="${index}">编辑</button>
      <button class="icon" data-copy="${esc(meta.bot(net))}">复制</button>
      <button class="icon" data-del="${index}">删除</button>
    </div>
  </div>`;
}

function maskToken(token) {
  const text = String(token);
  if (text.length <= 8) return text;
  return text.slice(0, 4) + '…' + text.slice(-4);
}

// ------------------------------------------------------------------ add menu
function openAddMenu() {
  const menu = $('#addMenu');
  if (!menu) return;
  if (menu.style.display !== 'none') { menu.style.display = 'none'; return; }
  menu.className = 'addmenu';
  menu.innerHTML = Object.keys(TYPE_META).map((type) => {
    const meta = TYPE_META[type];
    return `<button data-add="${type}"><div class="lbl">${esc(meta.label)}</div>
      <div class="desc">${esc(meta.brief)}</div></button>`;
  }).join('');
  menu.style.display = 'block';
}

function nextPort(base) {
  const used = new Set(draft.onebot.networks
    .filter((n) => n.type === 'httpServer' || n.type === 'wsServer')
    .map((n) => Number(n.port)));
  let port = base;
  while (used.has(port)) port++;
  return port;
}

function nextName(type) {
  const base = type === 'httpServer' ? 'http' : type === 'wsServer' ? 'ws'
    : type === 'httpClient' ? 'report' : 'reverse';
  const names = new Set(draft.onebot.networks.map((n) => n.name));
  let index = 1;
  while (names.has(base + index)) index++;
  return base + index;
}

function defaultNetwork(type) {
  const common = {
    name: nextName(type), type, enable: true, token: '',
    messagePostFormat: '', heartbeatInterval: 0, reportSelfMessage: false
  };
  if (type === 'httpServer') return { ...common, host: '127.0.0.1', port: nextPort(3000), enableWebSocket: false };
  if (type === 'wsServer') return { ...common, host: '127.0.0.1', port: nextPort(3001), role: 'universal' };
  if (type === 'httpClient') return { ...common, url: 'http://127.0.0.1:8080/', secret: '', timeout: 10000 };
  return { ...common, url: 'ws://127.0.0.1:8080/onebot/v11/ws', reconnectInterval: 5000, role: 'universal' };
}

// ------------------------------------------------------------------ modal
function renderModal() {
  const root = $('#modalRoot');
  if (!editing) { root.innerHTML = ''; return; }
  const value = editing.value;
  const meta = TYPE_META[value.type] || { label: value.type };
  const fields = [];
  fields.push(`
    <label class="field">名称
      <input data-edit-field="name" value="${esc(value.name)}" placeholder="唯一的名字，热重载靠它认人">
    </label>
    <label class="field">启用
      <label class="switch" style="padding-top:6px"><input type="checkbox" data-edit-field="enable" ${value.enable ? 'checked' : ''}>
        <span class="track"></span>保存后立即连接</label>
    </label>`);
  if (value.type === 'httpServer' || value.type === 'wsServer') {
    fields.push(`
      <label class="field">监听地址
        <input data-edit-field="host" value="${esc(value.host)}" placeholder="127.0.0.1">
        <span class="tip">只允许回环地址</span>
      </label>
      <label class="field">端口
        <input data-edit-field="port" type="number" min="1" max="65535" value="${esc(value.port)}">
      </label>`);
    if (value.type === 'httpServer') {
      fields.push(`
        <label class="field">同端口 WebSocket
          <label class="switch" style="padding-top:6px"><input type="checkbox" data-edit-field="enableWebSocket" ${value.enableWebSocket ? 'checked' : ''}>
            <span class="track"></span>让 WS 客户端也能连这个 HTTP 端口收事件</label>
        </label>`);
    } else {
      fields.push(`
        <label class="field">连接角色
          <select data-edit-field="role">
            ${['universal', 'api', 'event'].map((role) =>
              `<option value="${role}" ${value.role === role ? 'selected' : ''}>${role}</option>`).join('')}
          </select>
          <span class="tip">universal = 事件 + 动作；api / event 拆开用</span>
        </label>`);
    }
  } else {
    fields.push(`
      <label class="field">${value.type === 'httpClient' ? '上报地址（http/https）' : '框架 WebSocket 地址（ws/wss）'}
        <input data-edit-field="url" value="${esc(value.url)}" placeholder="${value.type === 'httpClient' ? 'http://127.0.0.1:8080/' : 'ws://127.0.0.1:8080/onebot/v11/ws'}">
        <span class="tip">${value.type === 'httpClient' ? '每条事件 POST 到这个 webhook' : '我们主动连过去，框架侧负责监听'}</span>
      </label>`);
    if (value.type === 'httpClient') {
      fields.push(`
        <label class="field">签名密钥（可选）
          <input data-edit-field="secret" value="${esc(value.secret)}" placeholder="X-Signature HMAC-SHA1">
        </label>
        <label class="field">超时（毫秒）
          <input data-edit-field="timeout" type="number" min="500" step="500" value="${esc(value.timeout)}">
        </label>`);
    } else {
      fields.push(`
        <label class="field">重连间隔（毫秒）
          <input data-edit-field="reconnectInterval" type="number" min="1000" step="1000" value="${esc(value.reconnectInterval)}">
        </label>
        <label class="field">连接角色
          <select data-edit-field="role">
            ${['universal', 'api', 'event'].map((role) =>
              `<option value="${role}" ${value.role === role ? 'selected' : ''}>${role}</option>`).join('')}
          </select>
        </label>`);
    }
  }
  fields.push(`
    <label class="field">Token（留空 = 跟随 OneBot 默认）
      <input data-edit-field="token" value="${esc(value.token)}">
    </label>
    <label class="field">消息格式
      <select data-edit-field="messagePostFormat">
        <option value="" ${value.messagePostFormat === '' ? 'selected' : ''}>跟随全局</option>
        <option value="array" ${value.messagePostFormat === 'array' ? 'selected' : ''}>array</option>
        <option value="string" ${value.messagePostFormat === 'string' ? 'selected' : ''}>string（CQ 码）</option>
      </select>
    </label>
    <label class="field">心跳间隔（毫秒）
      <input data-edit-field="heartbeatInterval" type="number" min="0" max="3600000" step="1000" value="${esc(value.heartbeatInterval)}">
      <span class="tip">0 = 跟随全局</span>
    </label>
    <label class="field">上报自身消息
      <label class="switch" style="padding-top:6px"><input type="checkbox" data-edit-field="reportSelfMessage" ${value.reportSelfMessage ? 'checked' : ''}>
        <span class="track"></span>只对这个网络生效</label>
    </label>`);
  root.innerHTML = `
    <div class="mask" id="mask">
      <div class="modal">
        <div class="mhead">
          <h3 style="margin:0;font-size:14.5px">${editing.mode === 'new' ? '新增' : '编辑'} · ${esc(meta.label)}</h3>
          <span class="grow"></span>
          <button class="icon" id="modalClose">✕</button>
        </div>
        <div class="mbody"><div class="grid">${fields.join('')}</div>
          <div class="err" id="modalErr"></div>
        </div>
        <div class="mfoot">
          <button class="btn" id="modalCancel">取消</button>
          <button class="btn primary" id="modalOk">${editing.mode === 'new' ? '添加' : '确定'}</button>
        </div>
      </div>
    </div>`;
}

function editValue(field) {
  const el = document.querySelector(`[data-edit-field="${field}"]`);
  if (!el) return undefined;
  if (el.type === 'checkbox') return el.checked;
  if (el.type === 'number') return Number(el.value) || 0;
  return el.value;
}

function modalError(text) {
  const box = $('#modalErr');
  if (!box) return;
  box.textContent = text || '';
  box.classList.toggle('show', !!text);
}

function modalOk() {
  if (!editing) return;
  const value = editing.value;
  const next = { ...value };
  for (const field of ['name', 'enable', 'host', 'port', 'enableWebSocket', 'url', 'secret',
    'timeout', 'reconnectInterval', 'role', 'token', 'messagePostFormat', 'heartbeatInterval', 'reportSelfMessage']) {
    const picked = editValue(field);
    if (picked !== undefined) next[field] = field === 'messagePostFormat' || field === 'name' || field === 'host' ||
      field === 'url' || field === 'secret' || field === 'role' || field === 'token'
      ? String(picked) : picked;
  }
  if (!next.name || !next.name.trim()) { modalError('名称不能为空'); return; }
  const duplicate = draft.onebot.networks.some((n, i) => n.name === next.name.trim() && i !== editing.index);
  if (duplicate) { modalError('名称重复了：换一个（热重载靠名称认网络）'); return; }
  next.name = next.name.trim();
  if (editing.mode === 'new') {
    draft.onebot.networks.push(next);
  } else {
    draft.onebot.networks[editing.index] = next;
  }
  editing = null;
  renderModal();
  setDirty(true);
  render();
}

// ------------------------------------------------------------------ actions
document.addEventListener('click', (event) => {
  const target = event.target.closest('[data-add],[data-edit],[data-del],[data-copy],[data-toggle-net],#addBtn,#saveBtn,#reloadBtn,#modalClose,#modalCancel,#modalOk,#mask,.addmenu');
  if (!target) return;
  if (target.id === 'addBtn') { openAddMenu(); return; }
  if (target.classList.contains('addmenu')) return;
  if (target.id === 'mask' && event.target === target) { editing = null; renderModal(); return; }
  if (target.id === 'modalClose' || target.id === 'modalCancel') { editing = null; renderModal(); return; }
  if (target.id === 'modalOk') { modalOk(); return; }
  if (target.id === 'saveBtn') { save(); return; }
  if (target.id === 'reloadBtn') { reload(true); return; }
  if (target.dataset.add) {
    $('#addMenu').style.display = 'none';
    editing = { mode: 'new', index: -1, value: defaultNetwork(target.dataset.add) };
    renderModal();
    return;
  }
  if (target.dataset.copy !== undefined) {
    const text = target.dataset.copy;
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(() => showToast('已复制：' + text, 'ok'))
      .catch(() => showToast('复制失败，手动选一下：' + text, 'warn'));
    return;
  }
  if (target.dataset.edit !== undefined) {
    const index = Number(target.dataset.edit);
    editing = { mode: 'edit', index, value: clone(draft.onebot.networks[index]) };
    renderModal();
    return;
  }
  if (target.dataset.del !== undefined) {
    const index = Number(target.dataset.del);
    const net = draft.onebot.networks[index];
    if (net && confirm(`删除网络「${net.name}」？保存后它的连接会断开。`)) {
      draft.onebot.networks.splice(index, 1);
      setDirty(true);
      render();
    }
    return;
  }
});

document.addEventListener('change', (event) => {
  const t = event.target;
  if (t.dataset && t.dataset.toggleNet !== undefined) {
    const index = Number(t.dataset.toggleNet);
    draft.onebot.networks[index].enable = t.checked;
    setDirty(true);
    render();
    return;
  }
  const bind = t.dataset && t.dataset.bind;
  if (!bind) return;
  let value;
  if (t.type === 'checkbox') value = t.checked;
  else if (t.type === 'number') value = Number(t.value) || 0;
  else value = t.value;
  applyBind(bind, value);
  // A checkbox has no caret to lose: redraw so the status line ("未启用" ->
  // "保存后开始监听") and the connection hint follow the toggle immediately.
  if (t.type === 'checkbox') render();
});

document.addEventListener('input', (event) => {
  const t = event.target;
  const bind = t.dataset && t.dataset.bind;
  if (!bind || t.type === 'checkbox') return;
  applyBind(bind, t.type === 'number' ? (Number(t.value) || 0) : t.value);
});

function applyBind(path, value) {
  const parts = path.split('.');
  let scope = draft;
  for (let i = 0; i < parts.length - 1; i++) scope = scope[parts[i]];
  scope[parts[parts.length - 1]] = value;
  setDirty(true);
}

$('#allowWrite').addEventListener('change', (event) => {
  allowed = event.target.checked;
  refreshSaveBtn();
  if (allowed) showToast('已允许修改：保存会立即改变监听端口和连接', 'warn');
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && editing) { editing = null; renderModal(); }
  if (event.key === 'Enter' && editing && (event.ctrlKey || event.metaKey)) { modalOk(); }
});

// ------------------------------------------------------------------ load / save / poll
async function reload(manual) {
  const res = await api('GET', '/api/network-config');
  if (!res.ok) {
    showToast('读取配置失败：' + (res.error || res.status), 'bad');
    return;
  }
  applyView(res.json);
  if (manual) showToast('已从端点重新载入配置', 'ok');
}

function applyView(nextView) {
  view = nextView;
  revision = nextView.revision;
  draft = clone(nextView.config);
  setDirty(false);
  render();
  if (editing) renderModal();
}

async function save() {
  if (!draft || busy) return;
  if (!allowed) { showToast('先在右下角打开「允许修改」，保存才会生效', 'warn'); return; }
  busy = true;
  refreshSaveBtn();
  const body = { config: draft, revision, allow_write: true };
  const res = await api('POST', '/api/network-config', body);
  busy = false;
  if (!res.ok) {
    showToast((res.status === 409 ? '配置已被别处修改：' : '保存失败：') + (res.error || res.status), 'bad');
    refreshSaveBtn();
    return;
  }
  const data = res.json.data || {};
  revision = data.revision;
  view = res.json.view || view;
  draft = clone(view.config);
  setDirty(false);
  render();
  const bits = ['Satori ' + (data.satori === 'started' ? '已启动' : data.satori === 'stopped' ? '已停止'
    : data.satori === 'rebound' ? '已换端口' : '未变')];
  if (data.onebot) {
    bits.push(`网络保留 ${data.onebot.kept.length} · 新开 ${data.onebot.opened.length} · 关闭 ${data.onebot.closed.length}`);
    if (data.onebot.failures && data.onebot.failures.length) {
      showToast('已保存，但部分网络没起来：' + data.onebot.failures.join('；'), 'bad');
      return;
    }
  }
  showToast('已保存并应用：' + bits.join('，'), 'ok');
}

async function pollStatus() {
  if (busy || editing) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  const res = await api('GET', '/api/network-config');
  if (!res.ok || !view) return;
  const nextView = res.json;
  const statusChanged = JSON.stringify(nextView.status) !== JSON.stringify(view.status);
  view.status = nextView.status;
  view.file = nextView.file;
  view.allowPublic = nextView.allowPublic;
  view.reservedPorts = nextView.reservedPorts;
  if (!dirty && nextView.revision !== revision) {
    revision = nextView.revision;
    draft = clone(nextView.config);
    view.config = nextView.config;
    render();
    showToast('配置在别处被修改，已自动载入最新版本', 'warn');
    return;
  }
  if (statusChanged) render();
}

async function pollAccount() {
  const res = await api('GET', '/api/snapshot');
  if (!res.ok || !res.json) return;
  bridge = { connected: !!res.json.bridgeConnected, self: res.json.self || null };
  const lamp = $('#bridgeLamp');
  lamp.className = 'lamp' + (bridge.connected ? ' on' : '');
  const self = bridge.self;
  $('#accountText').textContent = self && self.uin
    ? `${self.nick || ''} ${self.uin}`.trim()
    : (bridge.connected ? '桥已连接' : '桥离线');
}

// ------------------------------------------------------------------ boot
refreshSaveBtn();
reload(false);
pollAccount();
setInterval(pollStatus, 3000);
setInterval(pollAccount, 5000);
</script>
</body>
</html>
